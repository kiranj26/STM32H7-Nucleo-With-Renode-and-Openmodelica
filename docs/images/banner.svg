<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">STM32H7 Nucleo with Renode and OpenModelica</title>
  <desc id="d">Banner: closed-loop embedded control from model to emulator to silicon, with a step-response curve and a chip outline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)" opacity="0.55"/>

  <!-- step response decoration (right side) -->
  <g transform="translate(760,70)">
    <line x1="0" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="200" x2="0" y2="10" stroke="#334155" stroke-width="2"/>
    <path d="M0 200 H40 V60 H440" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M40 200 C 70 200, 80 40, 120 36 C 150 33, 165 72, 195 68 C 225 64, 240 56, 270 59 C 300 62, 330 60, 440 60"
          fill="none" stroke="url(#curve)" stroke-width="5" stroke-linecap="round"/>
    <text x="446" y="64" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">y(t)</text>
    <text x="46" y="52" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">r(t)</text>
    <text x="300" y="228" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">virtual time →</text>
  </g>

  <!-- chip icon -->
  <g transform="translate(64,62)">
    <rect x="10" y="10" width="76" height="76" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="48" y="44" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">H743</text>
    <text x="48" y="62" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">M7·480MHz</text>
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <path d="M26 0V10M42 0V10M58 0V10M74 0V10"/>
      <path d="M26 86V96M42 86V96M58 86V96M74 86V96"/>
      <path d="M0 26H10M0 42H10M0 58H10M0 74H10"/>
      <path d="M86 26H96M86 42H96M86 58H96M86 74H96"/>
    </g>
  </g>

  <text x="182" y="104" fill="#f8fafc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800">STM32H7 Control Lab</text>
  <text x="184" y="140" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">Renode · OpenModelica · Robot Framework · Nucleo-H743ZI2</text>

  <text x="66" y="218" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">Closed-loop embedded control,</text>
  <text x="66" y="250" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">from model → emulator → silicon.</text>

  <!-- pills -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="66" y="276" width="78" height="30" rx="15" fill="#0c4a6e"/><text x="105" y="296" text-anchor="middle" fill="#7dd3fc">MIL</text>
    <rect x="154" y="276" width="78" height="30" rx="15" fill="#3b0764"/><text x="193" y="296" text-anchor="middle" fill="#d8b4fe">SIL</text>
    <rect x="242" y="276" width="78" height="30" rx="15" fill="#7c2d12"/><text x="281" y="296" text-anchor="middle" fill="#fdba74">PIL</text>
    <rect x="330" y="276" width="78" height="30" rx="15" fill="#064e3b"/><text x="369" y="296" text-anchor="middle" fill="#6ee7b7">HW</text>
  </g>
</svg>
